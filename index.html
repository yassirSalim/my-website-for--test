<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Portfolio</title>

  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Header -->
  <header>
    <h1>My Portfolio</h1>
    <nav>
      <a href="#about">About</a>
      <a href="#projects">Projects</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <!-- About Section -->
  <section id="about" class="card">
    <h2>About Me</h2>

    <!-- Accessibility Feature -->
    <img 
      src="https://dehraflicks.com/wp-content/uploads/2025/07/men-icon-bg-png-dehraflicks.png" 
      alt="Profile picture of portfolio owner"
    >

    <p>
      Hello! I am a web development student learning HTML, CSS, and JavaScript.
    </p>
  </section>

  <!-- Projects Section -->
  <section id="projects" class="card">
    <h2>My Projects</h2>

    <div class="project">
      <h3>Project 1</h3>
      <p>Simple website made using HTML and CSS.</p>
    </div>

    <div class="project">
      <h3>Project 2</h3>
      <p>Interactive webpage using JavaScript.</p>
    </div>
  </section>

  <!-- Contact Section -->
  <section id="contact" class="card">
    <h2>Contact Me</h2>

    <form id="contactForm">
      <input type="text" id="name" placeholder="Your Name" required>

      <input type="email" id="email" placeholder="Your Email" required>

      <textarea id="message" placeholder="Your Message"></textarea>

      <button type="submit">Send</button>
    </form>

    <p id="result"></p>
  </section>

  <script src="script.js"></script>

</body>
</html>
